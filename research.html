<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Research · ICaR Lab</title>
<meta name="description" content="Research areas and funded projects of the Intelligent Control and Robotics Laboratory, Sejong University.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500;1,6..96,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="data/i18n.js"></script>
<script src="data/site.js"></script>
<script src="data/members.js"></script>
<script src="data/publications.js"></script>
<script src="data/projects.js"></script>

</head>
<body>

<div id="nav"></div>
<script>renderNav("research.html");</script>

<header class="pagehead">
  <div class="wrap">
    <p class="eyebrow" data-t="research.eyebrow"></p>
    <h1 class="h2" data-reveal data-t="research.title" style="max-width:30ch"></h1>
    <p class="lede" data-reveal data-t="research.lede" style="--d:90ms;margin-top:1.25rem"></p>
  </div>
</header>

<section class="band--tight wrap">
  <div class="grid grid--areas" id="areas-full"></div>
</section>

<section class="band--tight wrap">
  <figure class="band-photo" data-reveal>
    <img src="assets/img/area-robotics.jpg" alt="A robot manipulator gripper in the lab">
    <figcaption data-t="research.band"></figcaption>
  </figure>
</section>

<section class="band band--line wrap">
  <p class="eyebrow" data-t="projects.eyebrow"></p>
  <h2 class="h2" data-reveal data-t="projects.title" style="max-width:16ch"></h2>
  <div id="projects" style="margin-top:2.5rem"></div>
</section>

<div id="footer"></div>

<script>boot("research.html");</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300"
     role="img" aria-label="A feedback loop: reference, summing junction, controller, plant, and a sampled measurement returning through a delay">
  <!-- Control Algorithms card figure. Paper, ink and hairline are the site's
       own bg-soft, text and line colours. Signal names are serif italic and
       block names are mono uppercase, the same split the hero canvas uses. -->
  <style>
    .paper { fill: #f5f5f3 }
    .wire  { fill: none; stroke: #0a0a0a; stroke-width: 2.1; stroke-linecap: square }
    .thin  { fill: none; stroke: rgba(10,10,10,.34); stroke-width: 1.4 }
    .box   { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.9 }
    .name  { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             letter-spacing: 1.1px; fill: #0a0a0a; text-anchor: middle }
    .sym   { font: italic 22px Georgia, "Times New Roman", serif; fill: #0a0a0a; text-anchor: middle }
    .sig   { font: italic 17px Georgia, "Times New Roman", serif; fill: rgba(10,10,10,.72); text-anchor: middle }
    .op    { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             fill: rgba(10,10,10,.7); text-anchor: middle }
  </style>

  <rect class="paper" width="480" height="300"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#0a0a0a"/>
    </marker>
  </defs>

  <!-- reference in -->
  <path class="wire" marker-end="url(#a)" d="M26 118 H74"/>
  <text class="sig" x="36" y="105">r</text>

  <!-- summing junction -->
  <circle cx="90" cy="118" r="15" fill="#fff" stroke="#0a0a0a" stroke-width="1.9"/>
  <path class="thin" d="M83 118 H97 M90 111 V125"/>
  <text class="op" x="80" y="100">+</text>
  <text class="op" x="72" y="141">&#8722;</text>

  <!-- error -->
  <path class="wire" marker-end="url(#a)" d="M105 118 H136"/>
  <text class="sig" x="120" y="105">e</text>

  <!-- controller -->
  <rect class="box" x="138" y="92" width="88" height="52"/>
  <text class="sym" x="182" y="126">K</text>
  <text class="name" x="182" y="78">CONTROLLER</text>

  <!-- control input -->
  <path class="wire" marker-end="url(#a)" d="M226 118 H266"/>
  <text class="sig" x="246" y="105">u</text>

  <!-- plant, with the disturbance the lab's work accounts for -->
  <rect class="box" x="268" y="92" width="88" height="52"/>
  <text class="sym" x="312" y="126">G</text>
  <text class="name" x="312" y="78">PLANT</text>
  <path class="thin" marker-end="url(#a)" d="M312 40 V90"/>
  <text class="sig" x="326" y="52">d</text>

  <!-- output -->
  <path class="wire" marker-end="url(#a)" d="M356 118 H452"/>
  <text class="sig" x="428" y="105">y</text>
  <circle cx="396" cy="118" r="3.4" fill="#0a0a0a"/>

  <!-- measurement path: sampled, and delayed on its way back -->
  <path class="wire" d="M396 118 V222 H322"/>
  <rect class="box" x="212" y="196" width="110" height="52"/>
  <path class="wire" marker-end="url(#a)" d="M212 222 H105"/>
  <path class="wire" d="M90 222 V133"/>
  <path class="wire" marker-end="url(#a)" d="M90 145 V131"/>
  <text class="name" x="267" y="217">SAMPLED</text>
  <!-- a zero-order hold staircase, drawn small inside the block -->
  <path class="thin" d="M232 238 h13 v-9 h13 v-11 h13 v6 h13 v-8 h13"/>
  <text class="sig" x="160" y="212">h</text>
</svg>

<html lang="en">
<head>

<meta name="description" content="Journal and conference publications of Prof. Seok Young Lee and the ICaR Laboratory, with DOI links.">
<link rel="icon" href="assets/favicon.png" type="image/png">

     left to search results. -->
<meta name="application-name" content="ICaR Lab">
<meta name="apple-mobile-web-app-title" content="ICaR Lab">
<link rel="canonical" href="https://icarlaboratory.github.io/publications.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ICaR Lab">
<meta property="og:url" content="https://icarlaboratory.github.io/publications.html">
<meta property="og:title" content="Publications · ICaR Lab">
<meta property="og:description" content="Journal and conference publications of Prof. Seok Young Lee and the ICaR Laboratory, with DOI links.">
<meta property="og:image" content="https://icarlaboratory.github.io/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A feedback loop diagram: controller, robot manipulator and sampling sensor">
<meta property="og:locale" content="en_US">

<link rel="preload" href="assets/fonts/jetbrains-mono-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/publications.css">
<script src="data/site.js"></script>
<script src="data/members.js"></script>
<script src="data/publications.js"></script>
<script src="data/projects.js"></script>
<script src="data/courses.js"></script>
<script src="data/gallery.js"></script>

</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div id="nav"></div>
<script>renderNav("publications.html");</script>

<main id="main" tabindex="-1">

<header class="pagehead">
  <div class="wrap">
    <p class="eyebrow">Publications</p>
    <h1 class="h2" data-reveal style="max-width:24ch">Peer-reviewed work, newest first.</h1>
  </div>
</header>

<section class="band--tight wrap">
  <div class="publication-overview">
    <p class="muted" id="pubcounts"></p>
    <nav id="profiles" aria-label="Research profiles"></nav>
  </div>
  <div class="publication-tools" role="search" aria-label="Publication search and filters">
    <label class="publication-search-label" for="pubsearch">Search publications</label>
    <input id="pubsearch" type="search" placeholder="Title, authors, or venue" aria-describedby="pubsearch-hint" aria-controls="publist">
    <div class="publication-refine">
      <div class="filters" id="pubfilters" role="group" aria-label="Publication type">
        <button class="chip is-active" type="button" data-set="journal" aria-pressed="true" aria-controls="publist">Journal</button>
        <button class="chip" type="button" data-set="conference" aria-pressed="false" aria-controls="publist">Conference</button>
        <button class="chip" type="button" data-set="domestic" aria-pressed="false" aria-controls="publist">Domestic</button>
        <button class="chip" type="button" data-set="all" aria-pressed="false" aria-controls="publist">All</button>
      </div>
      <div class="publication-year">
        <label for="pubyear">Year</label>
        <select id="pubyear" aria-controls="publist"><option value="">All years</option></select>
      </div>
      <button id="pubreset" type="button" aria-controls="publist">Reset filters</button>
    </div>
    <p id="pubsearch-hint" class="muted">Search starts in All; selecting a type limits the search.</p>
  </div>
  <div class="publication-results-bar">
    <p id="pubresults" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
  <p id="pubempty" hidden>No publications match. Try another search or reset the filters.</p>
  <p class="pub-note">* corresponding author</p>
  <div id="publist"></div>
</section>

</main>

<div id="footer"></div>

<script>boot("publications.html");</script>
</body>
</html>

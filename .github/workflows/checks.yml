name: Site checks

on:
  push:
  pull_request:

# This workflow checks files only. It never deploys or publishes the site.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check JavaScript and Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              *.js|*.cjs|*.mjs) node --check "./$file" ;;
              *.sh) bash -n "./$file" ;;
            esac
          done < <(git ls-files -z)
          git diff --check

      - name: Run news unit tests
        run: node --test tests/news.test.cjs

      - name: Run publishing integration tests (disposable local remotes only)
        run: python3 -m unittest discover -s tests -p test_publish.py -v

      - name: Install font verification dependencies
        run: python3 -m pip install --disable-pip-version-check fonttools==4.46.0 Brotli==1.1.0

      - name: Verify self-hosted font coverage and asset integrity
        run: |
          python3 tools/check-font-coverage.py
          python3 -m unittest discover -s tests -p test_font_loading.py -v

      - name: Install development-only Chromium checks outside the site
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/icar-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/icar-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Run the real browser harness (runner manages local HTTP server)
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/icar-browser/node_modules/playwright/index.mjs
        run: node tools/run-browser-checks.mjs

<meta name="description" content="Journal and conference publications of Prof. Seok Young Lee and the ICaR Laboratory, with DOI links.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500;1,6..96,600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

<script src="data/i18n.js"></script>

<body>

<div id="nav"></div>
<script>renderNav("publications.html");</script>

<header class="pagehead">
  <div class="wrap">
    <p class="eyebrow" data-t="pubs.eyebrow"></p>
    <h1 class="h2" data-reveal data-t="pubs.title" style="max-width:22ch"></h1>
  </div>
</header>

<section class="band--tight wrap">
  <p class="muted" id="pubcounts" style="font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 1.5rem"></p>
  <div class="filters" id="pubfilters">
    <button class="chip is-active" type="button" data-set="journal" data-t="pubs.journal"></button>
    <button class="chip" type="button" data-set="conference" data-t="pubs.conference"></button>
    <button class="chip" type="button" data-set="all" data-t="pubs.all"></button>
  </div>
  <div id="publist"></div>
</section>

<div id="footer"></div>

<script>boot("publications.html");</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"
     role="img" aria-label="A feedback loop: a reference step into a summing junction, a controller driving a two-link arm, and the output measured by a sampling sensor that feeds back">
  <!-- Control Algorithms card figure, drawn to be read at the size a card
       actually shows: a card is about 334px wide, so type here is 13-15 units
       of a 480 unit frame, which lands around 10px. That budget is why the
       loop carries six words and not nine. Sentence case sans, because at
       10px it beats uppercase mono; ink and paper are the site's own. -->
  <style>
    .paper { fill: #f5f5f3 }
    .wire  { fill: none; stroke: #0a0a0a; stroke-width: 2; stroke-linecap: butt }
    .trace { fill: none; stroke: #0a0a0a; stroke-width: 2.2; stroke-linejoin: round }
    .thin  { fill: none; stroke: rgba(10,10,10,.42); stroke-width: 1.4 }
    .box   { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.9 }
    .name  { font: 500 14px "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
             fill: #0a0a0a; text-anchor: middle }
    .small { font: 400 12px "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
             fill: rgba(10,10,10,.62); text-anchor: middle }
    .op    { font: 400 16px "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
             fill: rgba(10,10,10,.75); text-anchor: middle }
    .gain  { font: italic 15px Georgia, "Times New Roman", serif; fill: #0a0a0a; text-anchor: middle }
    .sub   { font: italic 10px Georgia, "Times New Roman", serif }
  </style>

  <rect class="paper" width="480" height="300"/>

  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.8 L10 5 L0 9.2 Z" fill="#0a0a0a"/>
    </marker>
  </defs>

  <!-- the reference: a step, so the figure says what is being asked of the loop -->
  <text class="name" x="41" y="98">Reference</text>
  <path class="trace" d="M14 134 H26 C33 134 33 112 41 112 H68"/>
  <path class="wire" marker-end="url(#ca)" d="M68 126 H100"/>

  <!-- summing junction -->
  <circle cx="116" cy="126" r="15" fill="#fff" stroke="#0a0a0a" stroke-width="1.9"/>
  <path class="thin" d="M108 126 H124 M116 118 V134"/>
  <text class="op" x="103" y="108">+</text>
  <text class="op" x="97" y="153">&#8722;</text>

  <!-- controller -->
  <text class="name" x="196" y="90">Controller</text>
  <path class="wire" marker-end="url(#ca)" d="M131 126 H150"/>
  <rect class="box" x="152" y="100" width="88" height="52" rx="3"/>
  <!-- the two gains the research-page simulator puts on sliders -->
  <text class="gain" x="196" y="122">K<tspan class="sub" dy="3">p</tspan></text>
  <text class="gain" x="196" y="144">K<tspan class="sub" dy="3">d</tspan></text>

  <!-- the plant, drawn as the arm it is -->
  <text class="name" x="316" y="76">Dynamic system</text>
  <path class="wire" marker-end="url(#ca)" d="M240 126 H284"/>
  <g>
    <!-- Links at stroke 7, which is about 5px once a card scales this down;
         anything thinner reads as a bent wire rather than an arm. -->
    <path d="M302 168 L302 132 L348 114" fill="none" stroke="#0a0a0a" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- pedestal and floor -->
    <path d="M292 168 H312 L316 180 H288 Z" fill="#0a0a0a"/>
    <path d="M280 180 H324" stroke="#0a0a0a" stroke-width="2" fill="none"/>
    <path class="thin" d="M286 180 l-6 8 M298 180 l-6 8 M310 180 l-6 8 M322 180 l-6 8"/>
    <circle cx="302" cy="132" r="5" fill="#fff" stroke="#0a0a0a" stroke-width="2.2"/>
    <circle cx="348" cy="114" r="5.4" fill="#0a0a0a"/>
    <!-- the direction it is being driven -->
    <path d="M322 100 A 32 32 0 0 1 352 96" fill="none" stroke="rgba(10,10,10,.5)"
          stroke-width="2" marker-end="url(#ca)"/>
  </g>

  <!-- the output, and the response it settles into -->
  <text class="name" x="428" y="82">Output</text>
  <path class="wire" d="M356 126 H392"/>
  <!-- overshoot, then settle -->
  <path class="trace" d="M392 126 C 400 126 400 96 410 96 C 418 96 418 118 426 118 C 433 118 433 108 440 108 H466"/>
  <circle cx="372" cy="126" r="3.6" fill="#0a0a0a"/>

  <!-- measurement: sampled, and returned to the junction -->
  <text class="name" x="286" y="204">Sensing</text>
  <path class="wire" d="M372 126 V246 H330"/>
  <rect class="box" x="242" y="214" width="88" height="52" rx="3"/>
  <path class="thin" d="M254 254 h11 v-10 h11 v-12 h11 v7 h11 v-9 h11"/>
  <!-- one wire, one arrowhead, and it lands on the junction it feeds -->
  <path class="wire" marker-end="url(#ca)" d="M242 246 H116 V139"/>
  <text class="small" x="188" y="238">Feedback</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"
     role="img" aria-label="An embedded stack: a camera into a Raspberry Pi running ROS, over serial to an Arduino that reads sensors and drives a motor">
  <!-- Embedded Systems card figure. Same budget as its neighbour: a card is
       about 334px wide, so type sits at 13-14 units of a 480 unit frame and
       the stack carries seven words. The boards are told apart by where their
       ports sit and named underneath, rather than by colour. -->
  <style>
    .paper { fill: #f5f5f3 }
    .wire  { fill: none; stroke: #0a0a0a; stroke-width: 2 }
    .thin  { fill: none; stroke: rgba(10,10,10,.45); stroke-width: 1.4 }
    .board { fill: #ffffff; stroke: #0a0a0a; stroke-width: 1.9 }
    .part  { fill: rgba(10,10,10,.78) }
    .name  { font: 500 14px "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
             fill: #0a0a0a; text-anchor: middle }
    .small { font: 400 12px "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
             fill: rgba(10,10,10,.62); text-anchor: middle }
  </style>

  <rect class="paper" width="480" height="300"/>

  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.8 L10 5 L0 9.2 Z" fill="#0a0a0a"/>
    </marker>
  </defs>

  <!-- the graph of nodes the Pi is running -->
  <text class="name" x="132" y="26">ROS</text>
  <g>
    <path class="wire" d="M132 40 L112 66 H152 Z"/>
    <circle cx="132" cy="40" r="6" fill="#fff" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="112" cy="66" r="6" fill="#fff" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="152" cy="66" r="6" fill="#fff" stroke="#0a0a0a" stroke-width="2"/>
  </g>
  <path class="thin" stroke-dasharray="5 5" d="M132 74 V96"/>

  <!-- camera -->
  <g>
    <rect class="board" x="14" y="104" width="42" height="34" rx="3"/>
    <circle cx="35" cy="121" r="9" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <circle cx="35" cy="121" r="3.4" class="part"/>
    <path class="wire" d="M35 138 V148 M25 148 H45"/>
  </g>
  <text class="small" x="35" y="170">Camera</text>
  <path class="wire" marker-end="url(#ea)" d="M58 121 H76"/>

  <!-- Raspberry Pi: ports along the right edge -->
  <g>
    <rect class="board" x="78" y="98" width="112" height="60" rx="4"/>
    <g class="part">
      <rect x="86" y="104" width="60" height="7" rx="1"/>
      <rect x="96" y="120" width="26" height="20" rx="2"/>
      <rect x="86" y="146" width="14" height="7" rx="1"/>
    </g>
    <g fill="#fff" stroke="#0a0a0a" stroke-width="1.6">
      <rect x="164" y="106" width="22" height="14" rx="2"/>
      <rect x="164" y="124" width="22" height="14" rx="2"/>
      <rect x="164" y="142" width="22" height="12" rx="2"/>
    </g>
  </g>
  <text class="name" x="134" y="180">Raspberry Pi</text>

  <!-- the link between them -->
  <text class="small" x="223" y="112">Serial</text>
  <path class="wire" marker-end="url(#ea)" d="M192 122 H246"/>
  <path class="wire" marker-end="url(#ea)" d="M246 140 H192"/>

  <!-- Arduino: the USB block on the left edge -->
  <g>
    <rect class="board" x="256" y="98" width="112" height="60" rx="4"/>
    <rect x="248" y="106" width="18" height="18" rx="2" fill="#fff" stroke="#0a0a0a" stroke-width="1.6"/>
    <g class="part">
      <rect x="282" y="104" width="52" height="7" rx="1"/>
      <rect x="292" y="122" width="30" height="18" rx="2"/>
      <rect x="282" y="146" width="52" height="7" rx="1"/>
    </g>
  </g>
  <text class="name" x="300" y="180">Arduino</text>

  <!-- what it reads -->
  <g>
    <rect class="board" x="322" y="216" width="56" height="26" rx="3"/>
    <circle cx="336" cy="229" r="5" class="part"/>
    <circle cx="354" cy="229" r="5" class="part"/>
    <path class="thin" d="M388 236 v-12 h7 v12 h7 v-12 h7 v12"/>
  </g>
  <text class="small" x="350" y="262">Sensors</text>
  <path class="wire" marker-end="url(#ea)" d="M350 216 V162"/>

  <!-- and what it drives -->
  <g>
    <circle cx="426" cy="122" r="24" fill="#fff" stroke="#0a0a0a" stroke-width="1.9"/>
    <path d="M426 122 L426 102 M426 122 L443 132 M426 122 L409 132" stroke="#0a0a0a"
          stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="426" cy="122" r="4.6" fill="#0a0a0a"/>
    <path class="thin" d="M448 104 A 30 30 0 0 1 455 126" marker-end="url(#ea)"/>
  </g>
  <text class="name" x="426" y="170">Motor</text>
  <path class="wire" marker-end="url(#ea)" d="M370 122 H398"/>
</svg>

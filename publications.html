<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>Publications · ICaR Lab</title>
<meta name="description" content="Journal and conference publications of Prof. Seok Young Lee and the ICaR Laboratory.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
  /* pick the theme before first paint, so there is no flash */
  (function () {
    try {
      var t = localStorage.getItem("icar-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<script src="data/site.js"></script>
<script src="data/members.js"></script>
<script src="data/publications.js"></script>
<script src="data/projects.js"></script>
<script src="data/courses.js"></script>
<script src="assets/site.js"></script>
</head>
<body>

<div id="nav"></div>
<script>renderNav("publications.html");</script>

<header class="pagehead">
  <div class="wrap">
    <p class="eyebrow">Publications</p>
    <h1 class="h2" data-reveal style="max-width:18ch">Peer-reviewed work,<br>newest first.</h1>
    
  </div>
</header>

<section class="band--tight wrap">
  <p class="muted" id="pubcounts" style="font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 1.5rem"></p>
  <div class="filters" id="pubfilters">
    <button class="chip is-active" type="button" data-set="journal">Journal</button>
    <button class="chip" type="button" data-set="conference">Conference</button>
    <button class="chip" type="button" data-set="all">All</button>
  </div>
  <div id="publist"></div>
</section>

<div id="footer"></div>

<script>boot("publications.html");</script>
</body>
</html>
